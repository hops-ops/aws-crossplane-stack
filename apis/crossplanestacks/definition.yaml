apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: crossplanestacks.aws.hops.ops.com.ai
spec:
  group: aws.hops.ops.com.ai
  names:
    kind: CrossplaneStack
    plural: crossplanestacks
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: >-
          CrossplaneStack installs Crossplane core via Helm. Provider packages are
          installed by separate provider stack claims.
        type: object
        properties:
          spec:
            type: object
            required:
            - clusterName
            properties:
              clusterName:
                description: Name of the target cluster. Used as the default provider config name.
                type: string
              helmProviderConfigRef:
                description: ProviderConfig reference for the Helm provider on the management cluster (connects to target cluster).
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig. Defaults to clusterName.
                    type: string
                  kind:
                    description: Kind of the provider config reference.
                    type: string
                    enum: [ProviderConfig, ClusterProviderConfig]
              kubernetesProviderConfigRef:
                description: ProviderConfig reference for the Kubernetes provider on the management cluster (connects to target cluster).
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig. Defaults to clusterName.
                    type: string
                  kind:
                    description: Kind of the provider config reference.
                    type: string
                    enum: [ProviderConfig, ClusterProviderConfig]
              managementPolicies:
                type: array
                items:
                  type: string
                default: ["*"]
              labels:
                description: Labels applied to all composed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              install:
                description: Crossplane Helm release configuration.
                type: object
                properties:
                  namespace:
                    description: Namespace for Crossplane installation. Defaults to crossplane-system.
                    type: string
                  name:
                    description: Helm release name. Defaults to crossplane.
                    type: string
                  values:
                    description: Helm values merged with defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              nodePool:
                description: Optional dedicated Karpenter NodePool for Crossplane workloads.
                type: object
                properties:
                  enabled:
                    description: Create a dedicated NodePool (default false).
                    type: boolean
                  name:
                    description: NodePool name on the target cluster. Defaults to "hops-crossplane".
                    type: string
                  nodeClassName:
                    description: Name of the EKS NodeClass to reference (e.g. "default").
                    type: string
                  limits:
                    description: "NodePool resource limits (default: nodes=10)."
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  requirements:
                    description: "Karpenter requirement overrides (default: m/c families, amd64, on-demand)."
                    type: array
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  disruption:
                    description: "Disruption config (default: WhenEmptyOrUnderutilized, 60s)."
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              ready:
                type: boolean
              crossplane:
                type: object
                properties:
                  ready:
                    type: boolean
                  namespace:
                    type: string
                  releaseName:
                    type: string
                  chartVersion:
                    type: string
              nodePool:
                type: object
                properties:
                  ready:
                    type: boolean
                  name:
                    type: string
        required: [spec]
