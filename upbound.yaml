apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: aws-crossplane-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.7.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: ghcr.io/hops-ops/aws-pod-identity
    version: '>=v0.13.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws
    version: '>=v2.6.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-github
    version: '>=v0.19.1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-zitadel
    version: '>=v0.1.1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: ghcr.io/hops-ops/provider-openpanel
    version: '>=v1.1.1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: ghcr.io/hops-ops/provider-listmonk
    version: '>=v0.0.4'
  description: Installs Crossplane core plus the provider and function stack APIs
    used to bootstrap a target Crossplane control plane.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # aws-crossplane-stack
    Installs Crossplane core via Helm and publishes separate APIs for Crossplane
    provider and function stacks.
  repository: ghcr.io/hops-ops/aws-crossplane-stack
  source: github.com/hops-ops/aws-crossplane-stack
