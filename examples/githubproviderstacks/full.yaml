apiVersion: crossplane.hops.ops.com.ai/v1alpha1
kind: GitHubProviderStack
metadata:
  name: github
  namespace: default
spec:
  clusterName: my-cluster
  kubernetesProviderConfigRef:
    name: my-cluster
  githubOrg: hops-ops
  secretName: github-token
  externalSecret:
    remoteKey: github/hops-gitops
    githubApp:
      appIdKey: GH_APP_ID
      installationIdKey: GH_APP_INSTALLATION_ID
      privateKeyKey: GH_APP_KEY
  runtimeConfig:
    requestsCpu: 100m
    requestsMemory: 256Mi
  nodePool:
    enabled: true
