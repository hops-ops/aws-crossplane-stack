apiVersion: crossplane.hops.ops.com.ai/v1alpha1
kind: HelmProviderStack
metadata:
  name: helm
  namespace: default
spec:
  clusterName: my-cluster
  aws:
    enabled: true
    region: us-east-2
    providerConfigRef:
      name: my-cluster
      kind: ProviderConfig
    ecrRepositoryArns:
      - arn:aws:ecr:us-east-2:123456789012:repository/team/charts/*
  kubernetesProviderConfigRef:
    name: my-cluster
  runtimeConfig:
    requestsCpu: 100m
    requestsMemory: 256Mi
  nodePool:
    enabled: true
