apiVersion: crossplane.hops.ops.com.ai/v1alpha1
kind: FunctionsStack
metadata:
  name: functions
  namespace: default
spec:
  clusterName: my-cluster
  kubernetesProviderConfigRef:
    name: my-cluster
  # Schedule every function runtime onto the CrossplaneStack NodePool.
  nodePool:
    enabled: true
  functions:
    autoReady:
      package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
      # renovate: datasource=docker depName=crossplane-contrib/function-auto-ready registryUrl=https://xpkg.crossplane.io
      version: v0.7.0
      runtimeConfig:
        requestsCpu: 15m
        requestsMemory: 100Mi
    patchAndTransform:
      package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
      # renovate: datasource=docker depName=crossplane-contrib/function-patch-and-transform registryUrl=https://xpkg.crossplane.io
      version: v0.9.0
      runtimeConfig:
        requestsCpu: 50m
        requestsMemory: 256Mi
        cpu: "1"
        memory: 512Mi
