apiVersion: aws.hops.ops.com.ai/v1alpha1
kind: CrossplaneStack
metadata:
  name: crossplane
  namespace: default
spec:
  clusterName: production
  labels:
    team: platform
    environment: production
  install:
    namespace: crossplane-system
    name: crossplane
    values:
      resourcesCrossplane:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
  nodePool:
    enabled: true
    nodeClassName: default
    limits:
      nodes: 10
    requirements:
      - key: eks.amazonaws.com/instance-family
        operator: In
        values: ["m6i", "m7i", "c6i", "c7i"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["m6i.xlarge", "m7i.xlarge", "c6i.xlarge", "c7i.xlarge"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot"]
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 60s
