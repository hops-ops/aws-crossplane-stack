apiVersion: crossplane.hops.ops.com.ai/v1alpha1
kind: ZitadelProviderStack
metadata:
  name: zitadel
  namespace: default
spec:
  clusterName: my-cluster
  kubernetesProviderConfigRef:
    name: my-cluster
  runtimeConfig:
    requestsCpu: 100m
    requestsMemory: 256Mi
  nodePool:
    enabled: true
